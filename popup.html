<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Audio Router</title>
  <!-- No external font requests. Using system font stack in CSS. -->
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="icons/icon48.png" alt="" class="header-logo" width="24" height="24">
      <span class="header-title">Tab Audio Router</span>
    </div>
    <div id="status-badge" class="status-badge status-idle">Idle</div>
  </header>

  <!-- Main content area: loading → routing (or error) -->
  <main id="main-content">

    <!-- ── Loading ──────────────────────────────────────── -->
    <section id="loading-screen" class="screen">
      <div class="loading-spinner"></div>
    </section>

    <!-- ── Routing ──────────────────────────────────────── -->
    <section id="routing-screen" class="screen hidden">

      <!--
        Info banner — shown only when device labels are unavailable.
        Microphone permission is OPTIONAL and is used solely to reveal
        human-readable device names (e.g. "AirPods Pro" instead of "Device 1").
        Routing works correctly without it; device IDs are always present.
      -->
      <!-- Info banner for device discovery -->
      <div id="info-banner" class="info-banner hidden">
        <div class="info-banner-body">
          <span id="info-text" class="info-text">
            Physical device names are protected by browser privacy. Click Discover Devices to display your hardware outputs. Audio is never recorded.
          </span>
          <p id="discovery-error" class="discovery-error hidden"></p>
        </div>
        <div class="info-banner-actions">
          <button id="show-names-btn" class="btn btn-primary btn-sm" type="button">
            Discover Devices
          </button>
        </div>
      </div>

      <!-- Route Slot 1 -->
      <div class="route-card" id="route-card-0">
        <div class="route-card-header">
          <div class="slot-label">
            <span class="slot-number">Route 1</span>
            <span class="status-dot" id="status-dot-0"></span>
          </div>
          <span class="slot-status-text" id="slot-status-text-0">Not active</span>
        </div>
        <div class="route-card-body">
          <div class="field-group">
            <label class="field-label" for="tab-select-0">Tab</label>
            <div class="select-wrapper">
              <select id="tab-select-0" class="field-select" aria-label="Select tab for route 1">
                <option value="">Select a tab…</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="device-select-0">Output Device</label>
            <div class="select-wrapper">
              <select id="device-select-0" class="field-select" aria-label="Select output device for route 1">
                <option value="">Select device…</option>
              </select>
            </div>
          </div>
          <div class="field-group volume-group" id="volume-group-0">
            <div class="volume-header">
              <label class="field-label" for="volume-slider-0">Volume</label>
              <span class="volume-value" id="volume-value-0">100%</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="volume-slider-0" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume for route 1">
            </div>
          </div>
          <div class="route-card-actions">
            <button id="route-btn-0" class="btn btn-primary" type="button" disabled>
              Start Routing
            </button>
          </div>
          <p id="slot-error-0" class="slot-error hidden"></p>
        </div>
      </div>

      <!-- Route Slot 2 -->
      <div class="route-card" id="route-card-1">
        <div class="route-card-header">
          <div class="slot-label">
            <span class="slot-number">Route 2</span>
            <span class="status-dot" id="status-dot-1"></span>
          </div>
          <span class="slot-status-text" id="slot-status-text-1">Not active</span>
        </div>
        <div class="route-card-body">
          <div class="field-group">
            <label class="field-label" for="tab-select-1">Tab</label>
            <div class="select-wrapper">
              <select id="tab-select-1" class="field-select" aria-label="Select tab for route 2">
                <option value="">Select a tab…</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="device-select-1">Output Device</label>
            <div class="select-wrapper">
              <select id="device-select-1" class="field-select" aria-label="Select output device for route 2">
                <option value="">Select device…</option>
              </select>
            </div>
          </div>
          <div class="field-group volume-group" id="volume-group-1">
            <div class="volume-header">
              <label class="field-label" for="volume-slider-1">Volume</label>
              <span class="volume-value" id="volume-value-1">100%</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="volume-slider-1" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume for route 2">
            </div>
          </div>
          <div class="route-card-actions">
            <button id="route-btn-1" class="btn btn-primary" type="button" disabled>
              Start Routing
            </button>
          </div>
          <p id="slot-error-1" class="slot-error hidden"></p>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <button id="refresh-btn" class="btn btn-ghost btn-sm" title="Refresh tab and device lists" type="button">
          ↺ Refresh
        </button>
      </div>

    </section>

    <!-- ── Error (unsupported browser / fatal) ──────────── -->
    <section id="error-screen" class="screen hidden">
      <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h2 class="error-title">Not supported</h2>
        <p id="error-message" class="error-body"></p>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-text">🔒 Audio never leaves your device</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
